<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Oferday Cookie Sync</title>
  <style>
    :root {
      --bg: #0b111e;
      --card: #151f32;
      --border: #22314a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --brand-red: #e11d48;
      --brand-red-hover: #be123c;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --yellow-ml: #ffe600;
      --amazon-orange: #ff9900;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 350px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .logo-img {
      height: 28px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .badge-tag {
      background: rgba(225, 29, 72, 0.18);
      color: #fb7185;
      border: 1px solid rgba(225, 29, 72, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .input-group label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      background: #090e18;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .cookie-status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .cookie-status-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .store-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      font-size: 12px;
    }
    .pill {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-active {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .pill-inactive {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-sync {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: white;
      box-shadow: 0 3px 10px rgba(225, 29, 72, 0.35);
      margin-bottom: 8px;
    }
    .btn-sync:hover {
      background: linear-gradient(135deg, #be123c, #9f1239);
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(225, 29, 72, 0.45);
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 7px;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .status-box {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 11px;
      display: none;
      line-height: 1.4;
      font-weight: 500;
    }
    .status-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #a7f3d0;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .tip {
      font-size: 10px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/logo.png" alt="OferDay" class="logo-img">
    <span class="badge-tag">Cookie Sync</span>
  </div>

  <div class="section">
    <div class="section-title">🌐 Servidor do Bot</div>
    <div class="input-group">
      <input type="text" id="serverUrl" placeholder="https://oferday-production.up.railway.app">
    </div>
  </div>

  <div class="section">
    <div class="section-title">⚡ Sessões Detectadas</div>
    <div class="cookie-status-item">
      <div class="store-label">
        <span style="color: var(--yellow-ml)">🟡</span> Mercado Livre (meli.la)
      </div>
      <span id="mlBadge" class="pill pill-inactive">Verificando...</span>
    </div>
    <div class="cookie-status-item">
      <div class="store-label">
        <span style="color: var(--amazon-orange)">🟠</span> Amazon Brasil (amzn.to)
      </div>
      <span id="amzBadge" class="pill pill-inactive">Verificando...</span>
    </div>
  </div>

  <button id="btnSync" class="btn btn-sync">
    🔄 Sincronizar em 1 Clique
  </button>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
    <button id="btnCopyML" class="btn btn-secondary">Copiar Cookie ML</button>
    <button id="btnCopyAmz" class="btn btn-secondary">Copiar Cookie Amazon</button>
  </div>

  <div id="statusBox" class="status-box"></div>

  <div class="tip">
    💡 Certifique-se de estar logado no <b>mercadolivre.com.br</b> e <b>amazon.com.br</b>.
  </div>

  <script src="popup.js"></script>
</body>
</html>
