<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Oferday Cookie Sync</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --yellow-ml: #ffe600;
      --amazon-orange: #ff9900;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .badge-tag {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .input-group label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .cookie-status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .cookie-status-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .store-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 12px;
      font-weight: bold;
    }
    .pill-active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .pill-inactive { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      margin-bottom: 8px;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
      font-size: 11px;
      padding: 7px;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .status-box {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
      line-height: 1.4;
    }
    .status-success { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #a7f3d0; }
    .status-error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }
    .tip {
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">⚡</span>
    <div>
      <h1>Oferday Cookie Sync</h1>
      <span class="badge-tag">Sincronizador Oficial</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Endereço do Bot Oferday</div>
    <div class="input-group">
      <input type="text" id="serverUrl" placeholder="Ex: https://oferday-production.up.railway.app">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Status dos Cookies no Navegador</div>
    <div class="cookie-status-item">
      <div class="store-label">
        <span style="color: var(--yellow-ml)">🟡</span> Mercado Livre (meli.la)
      </div>
      <span id="mlBadge" class="pill pill-inactive">Verificando...</span>
    </div>
    <div class="cookie-status-item">
      <div class="store-label">
        <span style="color: var(--amazon-orange)">🟠</span> Amazon Brasil (amzn.to)
      </div>
      <span id="amzBadge" class="pill pill-inactive">Verificando...</span>
    </div>
  </div>

  <button id="btnSync" class="btn btn-primary">
    🔄 Sincronizar em 1 Clique com o Bot
  </button>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
    <button id="btnCopyML" class="btn btn-secondary">Copiar Cookie ML</button>
    <button id="btnCopyAmz" class="btn btn-secondary">Copiar Cookie Amazon</button>
  </div>

  <div id="statusBox" class="status-box"></div>

  <div class="tip">
    💡 Certifique-se de estar logado no <b>mercadolivre.com.br</b> e <b>amazon.com.br</b> neste navegador.
  </div>

  <script src="popup.js"></script>
</body>
</html>
